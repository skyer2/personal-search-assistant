harness:
  version: "1.0.0-research-agent-harness"
  max_retries: 2

  compression:
    enabled: true
    max_tokens: 500
    threshold_chars: 2000
    model: "qwen-turbo"
    retention_check: true
    retention_min_url: 0.8
    retention_min_number: 0.5

  context:
    max_step_message_tokens: 16000
    prior_results_max_steps: 5
    prior_snippet_max_chars: 400
    wrap_untrusted_external: true
    layer_budget_log_enabled: true
    fresh_thread_per_step: true
    layer_priority_eviction: true
    working_notes_enabled: true
    evidence_lookup_enabled: true
    clear_bulky_tool_results: true
    jit_retrieval_enabled: true
    research_brief_as_anchor: true
    evidence_max_items: 12
    reversible_compression: true
    tool_output_contract: true

  token_budget:
    model: "glm-5.2"
    context_window: 128000
    tool_schema_tokens: 4000
    reserved_output_tokens: 8000
    safety_margin: 2000
    stages:
      planner: 8000
      researcher: 16000
      synthesis: 40000
      verifier: 12000
      compress: 8000

  memory:
    provider: "sqlite"
    dsn: ""
    enabled: false
    recall_top_k: 5
    ttl_days: 90
    ttl_by_type:
      preference: 0
      procedural: 0
      semantic: 90
      episodic: 14
      source: 180
    volatile_semantic_ttl_days: 7
    max_facts_per_remember: 5
    min_fact_chars: 12
    wrap_untrusted: true
    embedding_enabled: true
    recall_keyword_weight: 0.4
    recall_embedding_weight: 0.6
    merge_jaccard_threshold: 0.55
    merge_embedding_threshold: 0.88
    pii_redact_enabled: true
    step_incremental_enabled: true
    step_incremental_write_longterm: false
    remember_on_partial: false
    utility_gate_enabled: true
    project_scope_enabled: true
    require_explicit_identity: true
    min_recall_trust: "derived"
    synthesis_min_trust: "derived"
    require_provenance_for_step_write: true
    source_ledger_enabled: true
    source_ledger_max_inject: 8
    source_freshness_days: 7
    step_recall_enabled: true
    step_recall_top_k: 3
    consolidation_enabled: false
    consolidation_async: false
    consolidation_durable: false
    consolidation_half_life_days: 30
    consolidation_min_confidence: 0.25
    consolidation_promote_min_sessions: 2
    consolidation_promote_min_confirmations: 2
    purge_after_days: 180

  validation:
    strict_mode: false

  observability:
    langfuse_enabled: true
    jsonl_log_enabled: true
    jsonl_log_dir: "logs/traces"
    metrics_enabled: true
    metrics_window_hours: 168
    prometheus_enabled: true
    usage_tracking_enabled: true
    content_mode: "redacted"

  budget:
    max_total_tokens: 100000
    max_tool_calls: 40
    max_step_tool_calls: 8
    max_run_sec: 600
    max_replan_count: 2
    max_plan_steps: 8

  experiment:
    default_mode: agent
    enabled_sources:
      web: true
      file: true
    agent:
      max_tool_calls: 40
      max_research_tasks: 5
      max_replan: 2
      parallel: true
      progress_eval: true
      compression: true
    direct:
      max_tool_calls: 8
      max_search_queries: 4
      max_replan: 0
      parallel: false
      progress_eval: false
      compression: false

  personal_search:
    default_mode: agent
    default_deliverable: chat
    enabled_sources:
      web: true
      file: true
    experiment:
      agent:
        max_tool_calls: 40
        max_research_tasks: 5
        max_replan: 2
        parallel: true
        progress_eval: true
      direct:
        max_tool_calls: 8
        max_search_queries: 4
        max_replan: 0
        parallel: false
        progress_eval: false

  tools:
    fail_closed: true
    enforce_step_policy: true

  hitl:
    enabled: false
    timeout_sec: 600
    plan_review_enabled: false
    allow_edit: true
    allow_replan: true
    interrupt_on:
      generate_markdown: true
      convert_md_to_pdf: true
      read_file_content: false
    step_gate_types: []

  citations:
    enabled: true
    min_coverage_rate: 0.2

  eval:
    trajectory_min_similarity: 0.6
    intent_deliverable_min_accuracy: 0.9
    plan_validation_min_rate: 1.0
    heuristic_judge_enabled: true
    heuristic_judge_min_score: 0.6
    llm_judge_enabled: false
    structured_output_min_rate: 0.8

  orchestration:
    parallel_retrieval_enabled: true
    max_parallel_workers: 3
    step_timeout_sec: 120
    enforce_subagent_binding: true
    step_checkpoint_enabled: true
    resume_checkpoint: true
    supervisor_temperature: 0.1
    structured_output_retry: true
    require_structured_worker_output: true
    synthesis_use_evidence_digest: true
    direct_worker_invoke: true
    persist_loop_state: false
    graph_runtime_enabled: true
    progress_eval_enabled: true
    graph_checkpoint_backend: sqlite
    graph_checkpoint_path: output/.harness/graph_checkpoints.sqlite

  planner:
    llm_enabled: true
    llm_min_confidence: 0.5
    llm_confirm_enabled: true
    llm_confirm_min_confidence: 0.5
    clarification_enabled: false
    clarification_auto_resolve: true
    plan_review_min_confidence: 0.75
    hybrid_enabled: true
    dynamic_lead_planner: true
    max_research_tasks: 5
    max_plan_patch_tasks: 2
