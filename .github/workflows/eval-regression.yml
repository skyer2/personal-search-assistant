name: Harness Release Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Architecture and control-plane invariants
        run: >
          uv run pytest -q
          tests/test_simple_fact_fast_path.py
          tests/test_control_plane_invariants.py
          tests/test_semantic_simplification_architecture.py
          tests/test_architecture_v2_stabilization.py

      - name: Full unit and integration suite
        run: >
          uv run pytest -q
          tests
          --ignore=tests/e2e
          --ignore=tests/eval

      - name: Deterministic and production-fidelity E2E
        run: uv run pytest -q tests/e2e/

      - name: Eval regression
        run: >
          uv run python tests/eval/run_eval.py
          --dry-run
          --baseline tests/eval/results/baseline.json
          --fail-on-regression

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: tests/eval/results/eval_report_*.json
          if-no-files-found: ignore
